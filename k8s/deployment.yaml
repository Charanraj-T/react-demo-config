
apiVersion: apps/v1
kind: Deployment

metadata:
  name: react-demo
  namespace: react-demo

spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-demo
  template:
    metadata:
      labels:
        app: react-demo
    spec:
      containers:
        - name: react-demo
          image: charanraj165/react-demo:sha-d34ee12d18fc3ac8e7e458bab29567b662330890
          ports:
            - containerPort: 80
