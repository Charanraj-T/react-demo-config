
apiVersion: apps/v1
kind: Deployment

metadata:
  name: react-app
  namespace: react-app

spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
        - name: react-app
          image: charanraj165/react-app:v1
          ports:
            - containerPort: 80
