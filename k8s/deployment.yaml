
apiVersion: apps/v1
kind: Deployment

metadata:
  name: react-demo
  namespace: react-demo

spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-demo
  template:
    metadata:
      labels:
        app: react-demo
    spec:
      containers:
        - name: react-demo
          image: charanraj165/react-demo:sha-8469b1cbb725843d52ea5d27bc876d0d2accdb3c
          ports:
            - containerPort: 80
