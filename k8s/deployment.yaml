
apiVersion: apps/v1
kind: Deployment

metadata:
  name: react-demo
  namespace: react-demo

spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-demo
  template:
    metadata:
      labels:
        app: react-demo
    spec:
      containers:
        - name: react-demo
          image: charanraj165/react-demo:sha-bd4538c0b9c3345a0766b7a910c69cb1f6ad8f4f
          ports:
            - containerPort: 80
