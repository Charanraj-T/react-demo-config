
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: react-demo
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/Charanraj-T/react-demo-config.git
    targetRevision: master
    path: k8s
  
  destination:
    server: https://kubernetes.default.svc
    namespace: react-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
